# ---- Server -------------------------------------------------------------
server.port=${PORT:8080}

# ---- Database: H2 in-memory (self-contained; state is lost on restart) ----
# LOCK_TIMEOUT: how long a settlement waits for a row lock held by another transaction.
spring.datasource.url=jdbc:h2:mem:upimesh;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
# A managed PostgreSQL is configured with one variable instead: DATABASE_URL=postgres://user:password@host:5432/name (see DatabaseUrlPostProcessor).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Developer console: local only. The hosted profile switches it off and it only accepts connections from this machine.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Never put stack traces, exception messages or binding details into HTTP error pages.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Static dashboard: always revalidate so an updated page is never served stale from the browser cache.
spring.web.resources.cache.cachecontrol.no-cache=true

# ---- Logging ------------------------------------------------------------
logging.level.com.demo.upimesh=INFO
# Unique-constraint hits are an expected, handled outcome (duplicate / repackaged payment), not an error.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{26} - %msg%n

# ---- Protocol policy ------------------------------------------------------
# Replay protection: reject payments whose signedAt is older than this window.
upi.mesh.freshness-window-seconds=86400
# Tolerated clock difference between sender phone and backend (future-dated signedAt).
upi.mesh.clock-skew-seconds=300
# Hop budget a new packet starts with (can be overridden per payment).
upi.mesh.default-ttl=5
upi.mesh.max-amount=1000000000
# How long the in-memory idempotency fast path remembers a packet hash (DB stays authoritative).
upi.mesh.idempotency-ttl-seconds=86400
# Attempts for transient settlement failures (lock timeout / optimistic-lock conflict).
upi.mesh.settlement-retries=3
# A claim stuck in PROCESSING longer than this (crashed worker) is released so the packet can be retried.
upi.mesh.processing-timeout-seconds=120
# The live demo mesh refuses new payments beyond this many packets (reset to continue); keeps a shared instance bounded.
upi.mesh.max-packets=500

# ---- Work budget of one experiment request (about 10 ms per simulation) and the one-at-a-time guard ----
upi.mesh.experiments.max-simulations=600
upi.mesh.experiments.max-submissions=6000

# ---- Access policy: everything off for local use. application-hosted.properties switches it on. ----
upi.mesh.security.hosted=false
upi.mesh.security.admin-token=
upi.mesh.security.writes-per-minute=0
upi.mesh.security.reads-per-minute=0
upi.mesh.security.max-body-bytes=65536

# ---- Mesh simulation baseline (restored by POST /api/mesh/reset) ----------
upi.mesh.sim.loss-probability=0.0
upi.mesh.sim.delay-rounds=0
# Devices stop forwarding/uploading a packet whose outer createdAt is older than this.
upi.mesh.sim.packet-expiry-seconds=86400
upi.mesh.sim.seed=42

# ---- Simulated demo accounts (fictional; restored by reset) ---------------
upi.mesh.accounts[0].vpa=alice@demo
upi.mesh.accounts[0].name=Alice
upi.mesh.accounts[0].balance=5000.00
upi.mesh.accounts[1].vpa=bob@demo
upi.mesh.accounts[1].name=Bob
upi.mesh.accounts[1].balance=1000.00
upi.mesh.accounts[2].vpa=carol@demo
upi.mesh.accounts[2].name=Carol
upi.mesh.accounts[2].balance=2500.00
upi.mesh.accounts[3].vpa=dave@demo
upi.mesh.accounts[3].name=Dave
upi.mesh.accounts[3].balance=500.00
