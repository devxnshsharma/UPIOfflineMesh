# Policy for a deployment other people can reach. Activate with SPRING_PROFILES_ACTIVE=hosted (render.yaml does).
# Nothing secret lives here: the admin token and the database URL come from environment variables.

# Reset, simulation settings and experiments need the admin token. With no token set they are switched off completely.
upi.mesh.security.hosted=true
upi.mesh.security.admin-token=${ADMIN_TOKEN:}
upi.mesh.security.writes-per-minute=${WRITES_PER_MINUTE:120}
upi.mesh.security.reads-per-minute=${READS_PER_MINUTE:900}

# Smaller budgets: a small shared instance has little CPU.
upi.mesh.experiments.max-simulations=200
upi.mesh.experiments.max-submissions=2000
upi.mesh.max-packets=200

# The developer database console is never reachable on a hosted deployment.
spring.h2.console.enabled=false

# Behind the platform's proxy: take the client address, scheme and host from the forwarded headers.
server.forward-headers-strategy=native
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
